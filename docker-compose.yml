version: '3.8'

services:
  api-ruteros:
    build: .
    container_name: api-ruteros
    ports:
      - "8086:8000"
    environment:
      - POCKETBASE_URL=https://ruteros.edwuarcardenas.online
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-cambiar-en-produccion}
    restart: always
